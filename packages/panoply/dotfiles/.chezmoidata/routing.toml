# Config routing rules — machine-readable.
#
# Shared workspace guidance lives in repository/package READMEs and normal docs.
# Shared AUTOMATED intent lives in profiles and Ontarch policies. APP-SPECIFIC SYNTAX stays in
# each app's own config file. App configs consume shared profile data; they are never the policy
# source of truth and never hold secrets.
#
# Each [routing.<app>] declares:
#   target                rendered config path under $HOME (app-specific syntax)
#   intent_source         where automated policy/intent lives
#   consumes_profile_data true — config is rendered from shared profile data
#   holds_secrets         false — secrets are referenced, never inlined
#   owned_by              layer that materializes the app config template
#
# Invariant (enforced by bin/validate.sh): for every app, consumes_profile_data = true and
# holds_secrets = false.

[routing.zed]
target = ".config/zed/settings.json"
intent_source = "repository READMEs + Workstreams/.agents/profiles + ontarch descriptors"
consumes_profile_data = true
holds_secrets = false
owned_by = "ontarch-agent-configs"

[routing.cursor]
target = ".cursor/ (rules + mcp.json)"
intent_source = "repository READMEs + Workstreams/.agents/profiles + ontarch policies"
consumes_profile_data = true
holds_secrets = false
owned_by = "ontarch-agent-configs"

[routing.claude]
target = ".claude/ (settings + CLAUDE.md)"
intent_source = "repository READMEs + Workstreams/.agents/profiles + ontarch policies"
consumes_profile_data = true
holds_secrets = false
owned_by = "ontarch-agent-configs"

[routing.factory]
target = ".factory/ (config)"
intent_source = "repository READMEs + Workstreams/.agents/profiles"
consumes_profile_data = true
holds_secrets = false
owned_by = "ontarch-agent-configs"

[routing.opencode]
target = ".config/opencode/ (config)"
intent_source = "repository READMEs + Workstreams/.agents/profiles + ontarch descriptors"
consumes_profile_data = true
holds_secrets = false
owned_by = "ontarch-agent-configs"
