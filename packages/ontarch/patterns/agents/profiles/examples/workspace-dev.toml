# Agent profile — workspace-dev (generic seed example).
# Customize allowed_paths / blocked_paths / session_log_target for your workspace.
# Authoring rules: flat [tables], inline double-quoted arrays, no nested tables,
# no inline comments (the Ontarch TOML reader subset). See profiles/README.md.
id = "workspace-dev"
title = "Workspace developer"
purpose = "Build one story per session: edit repo code, run moon tasks, stage commits locally"
rails = "panoply.agent"
rails_bin = "agent-bin"

[scope]
allowed_paths = ["**"]
blocked_paths = [".env*", "**/secrets/**", "**/private_dot_config/**"]

[commands]
allowed_commands = ["git status", "git diff", "git log", "git branch --show-current", "git worktree list", "rg", "moon run", "moon query", "panoply doctor", "panoply list", "panoply gen", "panoply env"]
gated_commands = ["git add", "git commit", "git pull", "git checkout -b", "git branch", "git switch"]
blocked_commands = ["git push", "git push --force", "git push --force-with-lease", "git reset --hard", "git clean", "gh release create", "gh pr merge", "rm -rf", "panoply bootstrap", "brew install", "mise install"]

[policy]
secret_access = false
remote_write_policy = "local-only"

[isolation]
mode = "worktree"
jj = "opt-in"

[skills]
loads_external = true
allowed_skill_ids = ["review", "improve"]

[validators]
required_validators = ["format", "skillspector_scan"]

[output]
compressor = "rtk"

[logs]
session_log_target = "packages/ontarch/registry/sessions"
